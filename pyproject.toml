[project]
name = "turbochickens"
version = "0.0.16"
description = "Local-first platform for ephemeral, just-in-time AI agent jobs."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "apscheduler>=3.11.3",
    "croniter>=3.0",
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "pydantic>=2.9",
    "rfc3339-validator>=0.1.4",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
tc = "turbochickens.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turbochickens"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
